name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances Python (mêmes versions que containers/tools/Dockerfile)
        run: pip install pandas==3.0.6 pysam==0.24.1 reportlab==5.0.1 pypdf==6.19.0 pdfplumber==0.11.10

      - name: Tests des scripts bin/
        run: python -m unittest discover -s tests/python -v

      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.04.6'

      - name: Lint
        run: nextflow lint .

      - name: Stub run
        run: nextflow run main.nf -profile test -stub-run

      - name: Mock run (vrais blocs script)
        run: |
          rm -rf results_test
          PATH="$PWD/tests/mocks/bin:$PATH" nextflow run main.nf -profile test \
              --splicelauncher tests/mocks/SpliceLauncher/SpliceLauncher.sh
          test -s results_test/irfinder/samplesheet/samplesheet.irfinder.outliers.tsv
          test -s results_test/irfinder/samplesheet/matrices/samplesheet.irfinder.IRratio.tsv
          test -s results_test/splicelauncher/samplesheet/filtered/samples/S1/S1.recap.tsv
          test -s results_test/splicelauncher/samplesheet/filtered/samples/S1/S1.sashimi/aberrant/chr1_300_1000_GENE1.pdf
